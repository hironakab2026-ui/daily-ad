<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>運動管理アプリ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1 id="topbar-title">今日</h1>
  </header>
  <main id="view"></main>
  <nav class="tabbar">
    <button data-tab="today" class="active"><span data-icon="home"></span>今日</button>
    <button data-tab="log"><span data-icon="records"></span>記録</button>
    <button data-tab="exercises"><span data-icon="dumbbell"></span>種目</button>
    <button data-tab="summary"><span data-icon="summary"></span>サマリー</button>
    <button data-tab="settings"><span data-icon="settings"></span>設定</button>
  </nav>
</div>
<div id="modal-root"></div>
<div id="toast" class="toast"></div>
<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
